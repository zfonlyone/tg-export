services:
  tg-export:
    build: .
    container_name: tg-export
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WEB_PORT:-9528}:${WEB_PORT:-9528}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data:shared
      - ${DOWNLOAD_DIR:-/storage/downloads}:/downloads:shared
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_HOST: ${WEB_HOST:-0.0.0.0}
      WEB_PORT: ${WEB_PORT:-9528}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EXPORT_DIR: ${EXPORT_DIR:-/downloads}
      DATA_DIR: /app/data
      # Security hardening toggles
      DISABLE_PERMISSION_FIX: ${DISABLE_PERMISSION_FIX:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_CHAT_ID: ${BOT_CHAT_ID:-0}
      BOT_TOPIC_ID: ${BOT_TOPIC_ID:-0}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS:-}
      USE_IPV6: ${USE_IPV6:-false}
      TDL_CONTAINER_NAME: ${TDL_CONTAINER_NAME:-tdl}
      PROXY_URL: ${PROXY_URL:-}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEB_PORT:-9528}/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3

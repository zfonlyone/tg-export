services:
  tg-export:
    image: tg-export:latest
    container_name: tg-export
    restart: unless-stopped
    env_file:
      - /etc/tg-export/.env
    ports:
      - "127.0.0.1:${WEB_PORT:-9528}:${WEB_PORT:-9528}"
    volumes:
      - /etc/tg-export/config:/app/config
      - /etc/tg-export/data:/app/data:shared
      - ${DOWNLOAD_DIR:-/storage/downloads}:/downloads:shared
    environment:
      EXPORT_DIR: ${EXPORT_DIR:-/downloads}
      DATA_DIR: /app/data
      SESSIONS_DIR: /app/data/sessions
      CONFIG_DIR: /app/config
      RUNTIME_ENV_FILE: /app/config/runtime.env
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEB_PORT:-9528}/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
